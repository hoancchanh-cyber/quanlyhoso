<script>
const API = "https://script.google.com/macros/s/AKfycbwgjQWBSm-pcZH-aOc3RCmBdRoU1kNNv6y9hXtkImNxSqBieTflg-sR-lY_4y3pD3X7/exec";

let dataGlobal = [];

/* chuyển trang */
function openPage(page) {
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("work").classList.add("hidden");

  document.getElementById(page).classList.remove("hidden");
}

/* mở link ngoài */
function go(url) {
  window.open(url, "_blank");
}

/* load dữ liệu */
async function load() {
  try {
    const res = await fetch(API);
    dataGlobal = await res.json();
    render();
  } catch (e) {
    alert("Không tải được dữ liệu!");
  }
}

/* render */
function render() {
  let user = document.getElementById("user").value;

  let total = 0, done = 0, processing = 0;
  let html = "";

  for (let i = 1; i < dataGlobal.length; i++) {
    let row = dataGlobal[i];

    /* lọc theo người (nếu có nhập tên) */
    if (user && row[4] !== user) continue;

    total++;

    if (row[5] == "Hoàn thành") done++;
    if (row[5] == "Đang xử lý") processing++;

    let cls = "todo";
    if (row[5] == "Đang xử lý") cls = "processing";
    if (row[5] == "Hoàn thành") cls = "done";

    html += `
    <tr>
      <td>${row[1]}</td>
      <td>${row[2]}</td>
      <td>${row[3]}</td>
      <td>${row[4]}</td>
      <td>
        <span class="status ${cls}" onclick="update('${row[0]}','${row[5]}')">
          ${row[5]}
        </span>
      </td>
    </tr>`;
  }

  document.getElementById("table").innerHTML = html;
  document.getElementById("total").innerText = total;
  document.getElementById("done").innerText = done;
  document.getElementById("processing").innerText = processing;
}

/* thêm công việc */
async function add() {
  const date = document.getElementById("date").value;
  const note = document.getElementById("note").value;
  const user = document.getElementById("user").value;
  const assign = document.getElementById("assign").value;

  if (!date || !note || !user || !assign) {
    alert("Nhập đầy đủ thông tin!");
    return;
  }

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      date: date,
      note: note,
      assigner: user,
      assignee: assign
    })
  });

  load(); // reload nhẹ, không refresh trang
}

/* cập nhật trạng thái */
async function update(id, currentStatus) {
  let next = "";

  if (currentStatus == "Chưa làm") next = "Đang xử lý";
  else if (currentStatus == "Đang xử lý") next = "Hoàn thành";
  else next = "Chưa làm";

  if (!confirm("Chuyển trạng thái sang: " + next + "?")) return;

  await fetch(API, {
    method: "PUT",
    body: JSON.stringify({ id: id, status: next })
  });

  load();
}

/* tự động lọc khi nhập tên */
document.getElementById("user").addEventListener("input", render);

load();
</script>
