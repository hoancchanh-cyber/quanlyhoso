<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hệ thống hồ sơ</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #dfe9f3);
    }

    /* Header */
    .header {
      background: #1e293b;
      color: white;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: 600;
    }

    /* Container */
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 60px);
    }

    /* Card */
    .card {
      background: white;
      width: 380px;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h2 {
      margin-bottom: 20px;
      color: #1e293b;
    }

    /* Button links */
    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 12px 15px;
      margin: 10px 0;
      border-radius: 8px;
      color: #fff;
      background: #2563eb;
      transition: 0.3s;
      font-size: 14px;
    }

    .link span {
      font-weight: 500;
    }

    .link:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    /* Different colors */
    .green { background: #16a34a; }
    .green:hover { background: #15803d; }

    .orange { background: #ea580c; }
    .orange:hover { background: #c2410c; }

    /* Footer */
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

<div class="header">
  📂 Hệ thống quản lý hồ sơ
</div>

<div class="container">
  <div class="card">
    <h2>Trang làm việc</h2>

    <a class="link" href="https://script.google.com/macros/s/AKfycbx40W9Yg2r5BqMCWglhK59LR_Tg1tD91jGkvv4kQHxoygvwTOtP8pz-bng4PK3OiDow8A/exec">
      <span>Quản lý hồ sơ</span> ➜
    </a>

    <a class="link green" href="https://dieuphoi.dichvucong.gov.vn/login">
      <span>Hệ thống điều phối TTHC</span> ➜
    </a>

    <a class="link orange" href="https://quantricong.dichvucong.gov.vn">
      <span>Hệ thống TTHC mới</span> ➜
    </a>

    <div class="footer">
      © 2026 - Nội bộ
    </div>
  </div>
</div>

</body>
</html>
