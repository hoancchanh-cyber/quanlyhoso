<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ thống điều hành công việc</title>

<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: #eef2f7;
}

/* HEADER */
.header {
  background: #1e293b;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
}

/* LAYOUT */
.main {
  display: flex;
}

/* SIDEBAR */
.sidebar {
  width: 250px;
  background: #1e293b;
  color: white;
  height: 100vh;
  padding: 20px;
}

.sidebar a {
  display: block;
  padding: 10px;
  color: white;
  text-decoration: none;
  margin: 5px 0;
}

.sidebar a:hover {
  background: #334155;
}

/* CONTENT */
.content {
  flex: 1;
  padding: 20px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.status {
  padding: 5px;
  border-radius: 5px;
  cursor: pointer;
}

.done { background: #16a34a; color: white; }
.processing { background: #f59e0b; }
.todo { background: #ef4444; color: white; }

/* BUTTON */
button {
  padding: 8px;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
  <div>📊 Hệ thống điều hành công việc</div>
  <div>
    👤 <input id="user" placeholder="Tên..." />
  </div>
</div>

<div class="main">

<div class="sidebar">
  <h3>Menu</h3>
  <a href="#">Dashboard</a>
  <a href="#">Lịch công việc</a>
  <a href="#">Thống kê</a>
</div>

<div class="content">

<h3>➕ Thêm công việc</h3>
<input id="date" type="date"><br>
<input id="note" placeholder="Nội dung"><br>
<input id="assign" placeholder="Giao cho ai"><br>
<button onclick="add()">Thêm</button>

<h3>📋 Danh sách công việc</h3>
<table>
<thead>
<tr>
<th>Ngày</th>
<th>Nội dung</th>
<th>Người giao</th>
<th>Người làm</th>
<th>Trạng thái</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>
</div>

<script>
const API = "DÁN_LINK_APPS_SCRIPT";

let dataGlobal = [];

async function load() {
  const res = await fetch(API);
  dataGlobal = await res.json();
  render();
}

function render() {
  let html = "";
  for (let i = 1; i < dataGlobal.length; i++) {
    let row = dataGlobal[i];

    let cls = "todo";
    if (row[5] == "Đang xử lý") cls = "processing";
    if (row[5] == "Hoàn thành") cls = "done";

    html += `
    <tr>
      <td>${row[1]}</td>
      <td>${row[2]}</td>
      <td>${row[3]}</td>
      <td>${row[4]}</td>
      <td>
        <span class="status ${cls}" onclick="update('${row[0]}')">
          ${row[5]}
        </span>
      </td>
    </tr>`;
  }

  document.getElementById("table").innerHTML = html;
}

async function add() {
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      date: document.getElementById("date").value,
      note: document.getElementById("note").value,
      assigner: document.getElementById("user").value,
      assignee: document.getElementById("assign").value
    })
  });

  location.reload();
}

async function update(id) {
  let status = prompt("Nhập trạng thái: Chưa làm / Đang xử lý / Hoàn thành");

  await fetch(API, {
    method: "PUT",
    body: JSON.stringify({ id: id, status: status })
  });

  location.reload();
}

load();
</script>

</body>
</html>
