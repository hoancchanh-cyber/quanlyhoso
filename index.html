<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Lịch công việc chung</title>

<link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background: #eef2f7;
  margin: 0;
}

.header {
  background: #1e293b;
  color: white;
  padding: 15px;
}

.container {
  display: flex;
  padding: 20px;
  gap: 20px;
}

.menu {
  width: 250px;
  background: white;
  padding: 15px;
  border-radius: 10px;
}

.content {
  flex: 1;
  background: white;
  padding: 20px;
  border-radius: 10px;
}

.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day {
  background: #f1f5f9;
  padding: 10px;
  min-height: 100px;
  border-radius: 6px;
  cursor: pointer;
}

.note {
  font-size: 12px;
  margin-top: 5px;
  background: #dbeafe;
  padding: 3px;
  border-radius: 4px;
}

/* modal */
.modal {
  display: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

.modal-content {
  background: white;
  padding: 20px;
  width: 300px;
  margin: 10% auto;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">📅 Lịch công việc chung</div>

<div class="container">

<div class="menu">
  <h4>Người dùng</h4>
  <input id="username" placeholder="Nhập tên..." />
</div>

<div class="content">
  <div id="calendar" class="calendar"></div>
</div>

</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <h4>Nhập công việc</h4>
    <textarea id="note" style="width:100%"></textarea>
    <button onclick="save()">Lưu</button>
  </div>
</div>

<script>
const API = "DÁN_LINK_APPS_SCRIPT_VÀO_ĐÂY";

let selectedDate = "";
let dataGlobal = [];

/* load dữ liệu */
async function loadData() {
  const res = await fetch(API);
  dataGlobal = await res.json();
  renderCalendar();
}

function renderCalendar() {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  for (let i = 1; i <= 30; i++) {
    let div = document.createElement("div");
    div.className = "day";
    div.innerHTML = "<b>" + i + "</b>";

    let dateStr = "2026-04-" + String(i).padStart(2,'0');

    dataGlobal.forEach(row => {
      if (row[0] === dateStr) {
        let note = document.createElement("div");
        note.className = "note";
        note.innerText = row[1] + " (" + row[2] + ")";
        div.appendChild(note);
      }
    });

    div.onclick = () => {
      selectedDate = dateStr;
      document.getElementById("modal").style.display = "block";
    };

    cal.appendChild(div);
  }
}

async function save() {
  const note = document.getElementById("note").value;
  const user = document.getElementById("username").value;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      date: selectedDate,
      note: note,
      user: user
    })
  });

  location.reload();
}

loadData();
</script>

</body>
</html>
