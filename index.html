<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Cổng nội bộ</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #eef2f7, #dfe9f3);
}

/* HEADER */
.header {
  background: #1e293b;
  color: white;
  padding: 15px 30px;
  display: flex;
  justify-content: space-between;
}

/* GRID */
.container {
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}

/* CARD */
.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.08);
}

.card h3 {
  margin-bottom: 15px;
  color: #1e293b;
  font-size: 16px;
}

/* LINK */
.link {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  color: white;
  text-decoration: none;
  background: #2563eb;
  transition: 0.25s;
}

.link:hover {
  transform: translateX(5px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

/* COLORS */
.green { background: #16a34a; }
.orange { background: #ea580c; }
.gray { background: #64748b; }

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 20px;
  color: #64748b;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="header">
  <div>🏢 Cổng nội bộ cơ quan</div>
  <div>📅 2026</div>
</div>

<div class="container">

  <!-- HỒ SƠ -->
  <div class="card">
    <h3>📂 Hồ sơ</h3>

    <a class="link" target="_blank"
      href="https://script.google.com/macros/s/AKfycbx40W9Yg2r5BqMCWglhK59LR_Tg1tD91jGkvv4kQHxoygvwTOtP8pz-bng4PK3OiDow8A/exec">
      Quản lý hồ sơ ➜
    </a>
  </div>

  <!-- HÀNH CHÍNH -->
  <div class="card">
    <h3>🌐 Hành chính</h3>

    <a class="link green" target="_blank"
      href="https://dieuphoi.dichvucong.gov.vn/login">
      Điều phối TTHC ➜
    </a>

    <a class="link orange" target="_blank"
      href="https://quantricong.dichvucong.gov.vn">
      TTHC mới ➜
    </a>
  </div>

  <!-- MỞ RỘNG -->
  <div class="card">
    <h3>⚙️ Hệ thống khác</h3>

    <a class="link gray" target="_blank" href="https://cas.gialai.gov.vn/cas/login?service=https://vpdt.gialai.gov.vn/cumphucat/shiro-cas#paperwork-menu-draft-doc">
      Email công vụ ➜
    </a>

    <a class="link gray" target="_blank" href="">
      Văn bản điện tử ➜
    </a>
  </div>

</div>

<div class="footer">
  © 2026 - Hệ thống nội bộ
</div>

</body>
</html>
